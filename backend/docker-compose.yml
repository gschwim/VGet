services:
  backend:
    build: .
    container_name: vget-backend
    ports:
      # Host:container. Behind Nginx in production, terminate TLS at Nginx and
      # proxy to this port; bind to 127.0.0.1 on the host if Nginx is local:
      #   - "127.0.0.1:8000:8000"
      - "8000:8000"
    env_file:
      - .env
    environment:
      # work dir lives on a tmpfs so downloaded media is ephemeral
      VGET_WORK_DIR: /data
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
