[project]
name = "vget"
version = "0.1.0"
description = ""
authors = [
    {name = "Greg Schwimer",email = "schwim@bitrail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp (>=2025.3.31,<2026.0.0)",
    "kivy (>=2.3.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "vget", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
vget-gui = "vget.main:main" 
